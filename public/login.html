<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MacroTracker</title>
    <style>
        :root { --bg: #f5f6fa; --card: #ffffff; --primary: #2ecc71; --text: #2f3640; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 400px; width: 100%; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; text-align: center; color: var(--primary); }
        label { display: block; margin-top: 15px; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 6px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>MacroTracker Login</h2>
        <form id="loginForm">
            <label>E-mail</label>
            <input type="email" id="email" required>

            <label>Senha</label>
            <input type="password" id="senha" required>

            <button type="submit">Entrar</button>
        </form>
        <div class="footer-link">
            Não tem uma conta? <a href="/cadastro.html">Cadastre-se</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
        });

        const dados = await res.json();
        if (res.status === 200) {
            // Guarda o token assinado gerado pelo BCrypt com segurança local
            localStorage.setItem('token_macros', dados.token);
            window.location.href = '/index.html';
        } else {
            alert(dados.erro || 'Falha no login.');
        }
    });
</script>
</body>
</html>
